<!DOCTYPE html>
{% load static stamped %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noai, noimageai">
<meta name="robots" content="noindex, nofollow">
<title>Nick Burczyk</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
<link rel="stylesheet" href="{% stamped 'css/portfolio.css' %}">
</head>
<body>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<div id="codec-screen">
  <div class="codec-inner">
    <div class="codec-call-box">
      <div class="codec-call-text">CALL</div>
    </div>
    <div class="codec-sub">PUSH SELECT</div>
    <button class="codec-btn" id="codec-btn" onclick="enterSite()">[ SELECT ]</button>
  </div>
</div>

<div id="screen">
  <div id="cx-top">
    <div class="ttl">NICK BURCZYK</div>
  </div>

  <div id="cx-codec">
    <div class="cx-portrait" id="cx-portrait-l">
      <img id="campbell" src="{% static 'codec/campbell_f00.png' %}" alt="Colonel">
      <div class="cx-noise"></div>
    </div>

    <div class="cx-device-col">
      <div class="cx-ptt">PTT</div>
      <div class="cx-device-wrap">
        <button class="cx-arrow left" onclick="tuneStep(-1)" aria-label="Previous frequency"></button>
        <div class="cx-device">
          <div class="cx-bars" id="cx-bars"></div>
          <div class="cx-freq"><span class="ghost">888.88</span><span id="freq-num">140.85</span></div>
        </div>
        <button class="cx-arrow right" onclick="tuneStep(1)" aria-label="Next frequency"></button>
      </div>
      <button class="cx-memory" onclick="toggleMemory()">MEMORY</button>
    </div>

    <div class="cx-portrait" id="cx-portrait-r">
      <img id="snake" src="{% static 'codec/snake_f00.png' %}" alt="Visitor">
      <div class="cx-noise"></div>
    </div>
  </div>

  <div id="cx-contact-name">COLONEL</div>
  <div id="cx-dialogue" onclick="skipTyping()" title="Click to skip"></div>

  <div id="cx-content"><div id="output"></div></div>

  <div id="cx-memory-panel">
    <div class="cx-mem-title"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>MEMORY</div>
    <div id="cx-mem-list"></div>
    <div class="cx-mem-foot"><svg class="ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><svg class="ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg> TUNE · M MEMORY · ESC CLOSE</div>
  </div>
</div>

{{ mc|json_script:"mc-data" }}
{{ voices|json_script:"voice-data" }}
<script>
const STATIC_URLS = {
  ring:       "{% static 'audio/ring.mp3' %}",
  hover:      "{% static 'audio/hover.mp3' %}",
  click:      "{% static 'audio/click.mp3' %}",
  menu:       "{% static 'audio/menu.mp3' %}",
  open:       "{% static 'audio/open.mp3' %}",
  uploadFile: "{% url 'upload_file' %}",
  song2vec:   "{% url 'song2vec_index' %}",
  minecraft:  "{% url 'minecraft' %}",
  live:       "{% url 'minecraft-live' %}",
  codecBase:  "{% static 'codec' %}",
  voiceBase:  "{% static 'audio/codec' %}",
  echoScout:  "{% stamped 'scripts/echo_scout.js' %}",
  mc:         JSON.parse(document.getElementById('mc-data').textContent),
  voices:     JSON.parse(document.getElementById('voice-data').textContent),
};
</script>
<script src="{% stamped 'scripts/portfolio.js' %}"></script>
</body>
</html>
