<!DOCTYPE html>
{% load static stamped %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noai, noimageai">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="description" content="Nick Burczyk: software developer and AI integration engineer.">
<title>Nick Burczyk</title>
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
<link rel="preload" href="{% static 'fonts/mgs1-codec-tall.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% stamped 'css/portfolio.css' %}">
<script>
  // The SELECT call screen is only for a visitor's first arrival in this tab.
  // A refresh or a trip back from another page goes straight to the codec.
  try { if (sessionStorage.getItem('cxEntered')) document.documentElement.classList.add('cx-returning'); } catch (e) {}
</script>
</head>
<body>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<div id="codec-screen">
  <div class="codec-inner">
    <div class="codec-call-box">
      <div class="codec-call-text">CALL</div>
    </div>
    <div class="codec-sub tall">PUSH SELECT</div>
    <button class="codec-btn" id="codec-btn" onclick="enterSite()" autofocus>[ SELECT ]</button>
  </div>
</div>

  <div id="cx-pin">
    <button class="cx-arrow left pin-step" onclick="tuneStep(-1)" aria-label="Previous frequency"></button>
    <span class="pin-freq" id="pin-freq">140.85</span>
    <button class="cx-arrow right pin-step" onclick="tuneStep(1)" aria-label="Next frequency"></button>
    <div class="pin-text" id="pin-text" title="Back to the codec"><span class="pin-who" id="pin-who"></span><span id="pin-line"></span></div>
  </div>

<div id="screen">
  <header id="cx-top">
    <div class="ttl">NICK BURCZYK</div>
    <button id="cx-mute" class="cx-mute" type="button"></button>
  </header>

  <div id="cx-codec">
    <div class="cx-portrait" id="cx-portrait-l">
      <img id="campbell" src="{% static 'codec/campbell_f00.png' %}" alt="Colonel">
      <div class="cx-noise"></div>
    </div>

    <div class="cx-device-col">
      <div class="cx-ptt" aria-hidden="true">PTT</div>
      <div class="cx-device-wrap">
        <button class="cx-arrow left" onclick="tuneStep(-1)" aria-label="Previous frequency"></button>
        <div class="cx-device">
          <div class="cx-bars" id="cx-bars"></div>
          <div class="cx-freq" aria-live="polite"><span class="ghost" aria-hidden="true">888.88</span><span id="freq-num">140.85</span></div>
        </div>
        <button class="cx-arrow right" onclick="tuneStep(1)" aria-label="Next frequency"></button>
      </div>
      <button class="cx-memory" onclick="toggleMemory()" aria-expanded="false" aria-controls="cx-memory-panel">MEMORY</button>
    </div>

    <div class="cx-portrait" id="cx-portrait-r">
      <img id="snake" src="{% static 'codec/snake_f00.png' %}" alt="Visitor">
      <div class="cx-noise"></div>
    </div>
  </div>

  <div id="cx-contact-name">COLONEL</div>
  <div id="cx-dialogue" onclick="skipTyping()" title="Click to skip"></div>

  <main id="cx-content"><div id="output"></div></main>

</div>

  <div id="cx-memory-panel" role="dialog" aria-label="Memory">
    <div class="cx-mem-title"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>MEMORY</div>
    <div id="cx-mem-list"></div>
    <div class="cx-mem-foot"><svg class="ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><svg class="ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg> TUNE &nbsp; M MEMORY &nbsp; ESC CLOSE</div>
  </div>

{{ mc|json_script:"mc-data" }}
{{ voices|json_script:"voice-data" }}
<script>
const STATIC_URLS = {
  ring:       "{% static 'audio/ring.mp3' %}",
  hover:      "{% static 'audio/hover.mp3' %}",
  click:      "{% static 'audio/click.mp3' %}",
  menu:       "{% static 'audio/menu.m4a' %}",
  open:       "{% static 'audio/open.mp3' %}",
  uploadFile: "{% url 'upload_file' %}",
  minecraft:  "{% url 'minecraft' %}",
  live:       "{% url 'minecraft-live' %}",
  codecBase:  "{% static 'codec' %}",
  voiceBase:  "{% static 'audio/codec' %}",
  projImg:    "{% static 'images/projects' %}",
  codecVer:   "{{ codec_ver }}",
  mc:         JSON.parse(document.getElementById('mc-data').textContent),
  voices:     JSON.parse(document.getElementById('voice-data').textContent),
};
</script>
<script src="{% stamped 'scripts/portfolio.js' %}"></script>
</body>
</html>
