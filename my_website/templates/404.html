<!DOCTYPE html>
{% load static stamped %}
<html lang="en">
<head>

<link rel="stylesheet" href="{% stamped 'css/portfolio.css' %}">

</head>
<body>
<div class="grid-overlay"></div>

      <button type="button" class="ps-btn ps-sm ps-alt" onclick="history.back()"><span class="ps-lbl">GO BACK</span></button>
