<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Portal</title>
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
<link rel="stylesheet" href="{% static 'css/portfolio.css' %}?t={% now 'U' %}">
<link rel="stylesheet" href="{% static 'css/minecraft.css' %}?t={% now 'U' %}">
</head>
<body>
<div class="grid-overlay"></div>

<div id="screen">

  <div id="stage">

    <div class="console-shell">

      <div class="console-screen">

        <div class="disc-titlebar">
          <span class="icon psone"></span>
          <span class="dt-name">GROID PACK</span>
          <span class="dt-sub">MINECRAFT PORTAL</span>
        </div>

        <div class="console-bg" id="console-bg"></div>
        <div class="console-content">

        <div class="disc-head">
          <span class="dh-t">◈ SELECT A DISC</span>
          <span class="dh-r"><span id="disc-pos">1</span> OF {{ seasons|length }}</span>
        </div>

        <div class="disc-rail">
          <button class="rail-arrow prev" onclick="discStep(-1)" aria-label="Previous disc">◂</button>
          <button class="rail-arrow next" onclick="discStep(1)" aria-label="Next disc">▸</button>
          <div class="disc-track" id="disc-track">
            {% for season in seasons %}
            <div class="disc-slot" id="disc-{{ forloop.counter0 }}" data-season="{{ season.number }}" onclick="discClick({{ forloop.counter0 }})">
              <div class="disc-case">
                <span class="disc-num">DISC {{ season.number }}</span>
                {% if season.has_logo %}
                <img src="{% static 'minecraft/season' %}{{ season.number }}/{{ season.logo_file }}" alt="{{ season.name }}">
                {% else %}
                <span class="disc-ph">S{{ season.number }}</span>
                {% endif %}
              </div>
              <div class="disc-slot-name">{{ season.name }}</div>
            </div>
            {% endfor %}
          </div>
        </div>

        <div class="disc-info">
          <div class="disc-title" id="disc-title">—</div>
          <div class="disc-desc" id="disc-desc"></div>
          <div class="disc-meters">
            <div class="ps-row">
              <span class="ps-nm">SCREENSHOTS</span>
              <div class="ps-prog"><div class="ps-fill" id="meter-shots" style="width:0%"></div></div>
              <span class="ps-pc" id="count-shots">0</span>
            </div>
            <div class="ps-row ps-dim">
              <span class="ps-nm">CLIPS</span>
              <div class="ps-prog"><div class="ps-fill" id="meter-clips" style="width:0%"></div></div>
              <span class="ps-pc" id="count-clips">0</span>
            </div>
          </div>

          <div class="roster" id="roster"></div>

          <div class="disc-media" id="disc-media">
            <div class="media-tabs">
              <button class="media-tab active" data-tab="screenshots" onclick="switchTab('screenshots')">
                <span class="icon l2"></span><span class="lbl">SCREENSHOTS</span>
                <span class="tab-count" id="tab-count-shots">0</span>
              </button>
              <button class="media-tab" data-tab="videos" onclick="switchTab('videos')">
                <span class="icon r2"></span><span class="lbl">CLIPS</span>
                <span class="tab-count" id="tab-count-clips">0</span>
              </button>
            </div>
            <div class="tab-panel active" data-panel="screenshots" id="panel-screenshots"></div>
            <div class="tab-panel" data-panel="videos" id="panel-videos"></div>
          </div>

        </div>

        </div>
      </div>

      <div class="console-deck">

        <div class="deck-cluster">
          <div class="deck-shoulders">
            <button class="icon l2 clickable" onclick="switchTab('screenshots')" title="Screenshots"></button>
            <button class="icon l1 clickable" onclick="shoulder(-1)" title="Previous disc"></button>
          </div>
          <div class="dpad">
            <button class="icon arrow-up clickable"    onclick="jumpTop()"    title="Top"></button>
            <button class="icon arrow-left clickable"  onclick="discStep(-1)" title="Previous disc"></button>
            <div class="dpad-hub"></div>
            <button class="icon arrow-right clickable" onclick="discStep(1)"  title="Next disc"></button>
            <button class="icon arrow-down clickable"  onclick="jumpMedia()"  title="Jump to media"></button>
          </div>
        </div>

        <div class="deck-mid">
          <a class="icon select select-label clickable" href="{% url 'index' %}" title="Back to codec"></a>
          <button class="icon start start-label clickable" onclick="loadDisc()" title="Load this disc"></button>
        </div>

        <div class="deck-cluster">
          <div class="deck-shoulders">
            <button class="icon r2 clickable" onclick="switchTab('videos')" title="Clips"></button>
            <button class="icon r1 clickable" onclick="shoulder(1)" title="Next disc"></button>
          </div>
          <div class="face">
            <button class="icon triangle clickable" onclick="jumpTop()"  title="Top"></button>
            <button class="icon square clickable"   onclick="cycleTab()" title="Switch media"></button>
            <button class="icon circle clickable"   onclick="psxBack()"  title="Back"></button>
            <button class="icon x clickable"        onclick="loadDisc()" title="Load disc"></button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <div id="lightbox">
    <div id="lightbox-counter">FILE <b id="lb-counter-text">1 / 1</b></div>
    <button class="lb-btn" id="lightbox-close" onclick="closeLightbox()">
      <span class="icon circle"></span><span>CLOSE</span>
    </button>
    <div id="lightbox-media-wrap"></div>
    <div id="lightbox-caption"></div>
    <div id="lightbox-nav">
      <button class="lb-btn" onclick="lbStep(-1)"><span class="icon l1"></span><span>◂ PREV</span></button>
      <button class="lb-btn" onclick="lbStep(1)"><span class="icon r1"></span><span>NEXT ▸</span></button>
    </div>
  </div>

</div>

<script>
const PORTAL_URLS = {
  hover: "{% static 'audio/hover.mp3' %}",
  click: "{% static 'audio/click.mp3' %}",
};
const HOME_URL = "{% url 'index' %}";

const SEASONS = [
  {% for season in seasons %}
  {
    "key": "season{{ season.number }}",
    "number": {{ season.number }},
    "name": "{{ season.name|escapejs }}",
    "description": "{{ season.description|escapejs }}",
    "hero": "{{ season.hero|default_if_none:'' }}",
    "roster": {{ season.roster_json|safe }},
    "screenshots": [
      {% for item in season.screenshots %}
      { "type": "img", "url": "{{ item.url }}", "label": "{{ item.label|escapejs }}" }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ],
    "videos": [
      {% for item in season.videos %}
      { "type": "video", "url": "{{ item.url }}", "label": "{{ item.label|escapejs }}" }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ]
  }{% if not forloop.last %},{% endif %}
  {% endfor %}
];
</script>
<script type="module" src="{% static 'scripts/mcmodel.js' %}?t={% now 'U' %}"></script>
<script src="{% static 'scripts/minecraft.js' %}?t={% now 'U' %}"></script>
</body>
</html>
